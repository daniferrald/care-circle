<!DOCTYPE html>
<html lang="en" data-skin="studio">
<head>
<meta charset="UTF-8">
<title>Care Circle — Prototype</title>
<style>
/* ═══════════════════════════════════════════════════════════════════
   AGENTIC AI CAPSTONE — LOCKED DESIGN TOKENS  v0.3
   The look ships in the box. Nobody chooses a font.

   RULES (for the AI building the prototype):
   - Inline this file into index.html. Use ONLY these tokens.
   - No new colors. No new fonts. No emoji as icons.
   - Skins switch by setting data-skin="ops" | "studio" | "term" on <html>.
   - Never render body text below 13px (--fs-0).
   ═══════════════════════════════════════════════════════════════════ */

:root {
  /* type */
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --fs-0: 13px;  /* meta, log lines — absolute floor */
  --fs-1: 14px;  /* body */
  --fs-2: 16px;  /* emphasized body, buttons */
  --fs-3: 20px;  /* panel titles */
  --fs-4: 28px;  /* page title, stat numbers */
  --lh: 1.5;

  /* spacing & shape */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 24px; --sp-6: 32px;
  --radius: 10px;
  --radius-sm: 6px;
  --border-w: 1px;

  /* status colors — shared across all skins */
  --ok: #1FA971;        /* pass / approved */
  --warn: #D98E04;      /* needs work / pending */
  --danger: #D64545;    /* fail / escalate / refused */
  --info: #3B82F6;      /* running / info */
}

/* ── SKIN: OPERATIONS (dark) — default ─────────────────────────── */
:root, [data-skin="ops"] {
  --bg: #0F1420;         /* page */
  --bg-raise: #171E2E;   /* panels, cards */
  --bg-inset: #0B0F18;   /* wells, log */
  --line: #263049;       /* borders */
  --ink: #E8EDF7;        /* headings, primary text */
  --ink-2: #9AA6BF;      /* secondary text */
  --ink-3: #5E6A85;      /* meta */
  --accent: #6C8CFF;     /* brand accent: buttons, active states */
  --accent-ink: #FFFFFF; /* text on accent */
  --chip: #1E2740;       /* tags, chips */
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.55);
  --font-body: var(--font-ui);
}

/* ── SKIN: STUDIO (light) ──────────────────────────────────────── */
[data-skin="studio"] {
  --bg: #F6F7FB;
  --bg-raise: #FFFFFF;
  --bg-inset: #EEF0F6;
  --line: #E1E5EF;
  --ink: #131A2A;
  --ink-2: #4C5670;
  --ink-3: #8B93A9;
  --accent: #4056C9;
  --accent-ink: #FFFFFF;
  --chip: #EDF0FA;
  --shadow: 0 1px 2px rgba(19,26,42,.06), 0 12px 28px -14px rgba(19,26,42,.18);
  --font-body: var(--font-ui);
}

/* ── SKIN: TERMINAL (mono) ─────────────────────────────────────── */
[data-skin="term"] {
  --bg: #0C0F0C;
  --bg-raise: #121712;
  --bg-inset: #080B08;
  --line: #223122;
  --ink: #D7F5DC;
  --ink-2: #8FBE97;
  --ink-3: #567A5D;
  --accent: #35D07F;
  --accent-ink: #06130A;
  --chip: #16301E;
  --shadow: 0 0 0 1px rgba(53,208,127,.08), 0 12px 32px -14px rgba(0,0,0,.7);
  --font-body: var(--font-mono);
}

/* ═══ BASE ═══ */
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs-1); line-height: var(--lh);
}

/* ═══ LAYOUT ═══ */
.topbar {
  display: flex; align-items: center; gap: var(--sp-3);
  padding: var(--sp-3) var(--sp-5);
  background: var(--bg-raise); border-bottom: var(--border-w) solid var(--line);
}
.topbar .product { font-size: var(--fs-2); font-weight: 700; letter-spacing: .01em; }
.topbar .meta { color: var(--ink-3); font-size: var(--fs-0); margin-left: auto; }

.console {
  display: grid; grid-template-columns: 300px 1fr 320px;
  gap: var(--sp-4); padding: var(--sp-4); align-items: start;
  min-height: calc(100vh - 58px);
}
@media (max-width: 1100px) { .console { grid-template-columns: 1fr; } }

.panel {
  background: var(--bg-raise); border: var(--border-w) solid var(--line);
  border-radius: var(--radius); box-shadow: var(--shadow);
}
.panel-head {
  padding: var(--sp-3) var(--sp-4); border-bottom: var(--border-w) solid var(--line);
  font-size: var(--fs-0); font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-2);
}
.panel-body { padding: var(--sp-4); }

/* ═══ STAGE LABELS — the loop, named on screen ═══ */
.stage {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  font-size: var(--fs-0); font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
  color: var(--accent); margin: var(--sp-4) 0 var(--sp-2);
}
.stage::before {
  content: attr(data-n); display: inline-flex; align-items: center; justify-content: center;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--accent); color: var(--accent-ink);
  font-size: 11px; letter-spacing: 0;
}

/* ═══ CARDS (case list) ═══ */
.case-card {
  padding: var(--sp-3) var(--sp-4); border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm); background: var(--bg-raise);
  cursor: pointer; margin-bottom: var(--sp-2);
}
.case-card:hover { border-color: var(--accent); }
.case-card.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.case-card .id { font-family: var(--font-mono); font-size: var(--fs-0); color: var(--ink-3); }
.case-card .title { font-weight: 600; }

/* ═══ CHIPS (one-click demo cases, citations) ═══ */
.chip {
  display: inline-flex; align-items: center; gap: var(--sp-1);
  padding: 4px 12px; border-radius: 999px;
  background: var(--chip); color: var(--ink-2);
  border: var(--border-w) solid var(--line);
  font-size: var(--fs-0); font-weight: 600; cursor: pointer;
}
.chip:hover { color: var(--ink); border-color: var(--accent); }
.chip.cite { cursor: default; font-family: var(--font-mono); }

/* ═══ OUTPUT FIELDS — labeled, judgeable in under a minute ═══ */
.field { display: grid; grid-template-columns: 160px 1fr; gap: var(--sp-3); padding: var(--sp-2) 0; border-bottom: var(--border-w) solid var(--line); }
.field:last-child { border-bottom: 0; }
.field .k { font-size: var(--fs-0); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); padding-top: 2px; }
.field .v { color: var(--ink); white-space: pre-wrap; }
.field .v.why { color: var(--ink-2); font-style: italic; }

/* ═══ STATUS BADGES ═══ */
.badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 999px;
  font-size: var(--fs-0); font-weight: 700; letter-spacing: .04em;
}
.badge::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.badge.ok      { color: var(--ok);     background: color-mix(in srgb, var(--ok) 14%, transparent); }
.badge.warn    { color: var(--warn);   background: color-mix(in srgb, var(--warn) 14%, transparent); }
.badge.danger  { color: var(--danger); background: color-mix(in srgb, var(--danger) 14%, transparent); }
.badge.info    { color: var(--info);   background: color-mix(in srgb, var(--info) 14%, transparent); }
.badge.neutral { color: var(--ink-2);  background: var(--chip); }

/* ═══ BUTTONS — the human gate ═══ */
.btn {
  display: inline-flex; align-items: center; gap: var(--sp-2);
  padding: 8px 18px; border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--line);
  background: var(--bg-raise); color: var(--ink);
  font-family: var(--font-body); font-size: var(--fs-1); font-weight: 700;
  cursor: pointer;
}
.btn:hover { border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.approve { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.danger  { background: transparent; border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger); color: #fff; }

/* ═══ THE BOUNDARY LINE — quiet, permanent ═══ */
.boundary-note {
  font-size: var(--fs-0); color: var(--ink-3);
  border-left: 2px solid var(--accent); padding-left: var(--sp-3);
  margin-top: var(--sp-3);
}

/* ═══ RUN LOG ═══ */
.log {
  background: var(--bg-inset); border: var(--border-w) solid var(--line);
  border-radius: var(--radius-sm); padding: var(--sp-3);
  font-family: var(--font-mono); font-size: var(--fs-0);
  max-height: 420px; overflow: auto;
}
.log .row { display: flex; gap: var(--sp-3); padding: 3px 0; color: var(--ink-2); }
.log .row .t { color: var(--ink-3); flex: none; }
.log .row .action-approve  { color: var(--ok); }
.log .row .action-edit     { color: var(--warn); }
.log .row .action-escalate { color: var(--danger); }

/* ═══ EVALS ═══ */
.evals-table { width: 100%; border-collapse: collapse; font-size: var(--fs-1); }
.evals-table th {
  text-align: left; font-size: var(--fs-0); letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); padding: var(--sp-2) var(--sp-3); border-bottom: var(--border-w) solid var(--line);
}
.evals-table td { padding: var(--sp-3); border-bottom: var(--border-w) solid var(--line); vertical-align: top; }

.scoreboard { display: flex; gap: var(--sp-4); margin-bottom: var(--sp-4); }
.stat {
  flex: 1; padding: var(--sp-4); text-align: center;
  background: var(--bg-raise); border: var(--border-w) solid var(--line); border-radius: var(--radius);
}
.stat .n { font-size: var(--fs-4); font-weight: 800; line-height: 1.1; }
.stat .l { font-size: var(--fs-0); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stat.ok .n { color: var(--ok); } .stat.warn .n { color: var(--warn); } .stat.danger .n { color: var(--danger); }

/* ═══ STATES ═══ */
.thinking { display: inline-flex; align-items: center; gap: var(--sp-2); color: var(--info); font-weight: 600; }
.thinking::before { content: ""; width: 12px; height: 12px; border: 2px solid var(--info); border-top-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.empty {
  padding: var(--sp-6); text-align: center; color: var(--ink-2);
}
.empty .headline { font-size: var(--fs-3); font-weight: 700; color: var(--ink); margin-bottom: var(--sp-2); }

.error-note {
  padding: var(--sp-3) var(--sp-4); border-radius: var(--radius-sm);
  border: var(--border-w) solid var(--danger);
  background: color-mix(in srgb, var(--danger) 8%, transparent);
  color: var(--danger); font-size: var(--fs-1); white-space: pre-wrap;
}

/* ═══ KNOWN LIMITATIONS ═══ */
.limitations-list { margin: 0; padding-left: var(--sp-5); }
.limitations-list li { margin-bottom: var(--sp-3); color: var(--ink); }
.limitations-list li:last-child { margin-bottom: 0; }

/* ═══ SUPPLEMENTARY — reference tables (roster, policies), built from the same tokens ═══ */
table.data-table { border-collapse: collapse; width: 100%; }
table.data-table th, table.data-table td {
  border: var(--border-w) solid var(--line); padding: var(--sp-2) var(--sp-3);
  text-align: left; font-size: var(--fs-1); color: var(--ink);
}
table.data-table th {
  color: var(--ink-2); font-size: var(--fs-0); font-weight: 700;
  text-transform: uppercase; letter-spacing: .08em;
}
.secondary-panels { padding: 0 var(--sp-4) var(--sp-4); display: flex; flex-direction: column; gap: var(--sp-4); }
.case-detail dl { margin: 0 0 var(--sp-4); }
.case-detail dt { font-size: var(--fs-0); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); margin-top: var(--sp-2); }
.case-detail dd { margin: 0; color: var(--ink); }
</style>
</head>
<body>

<div class="topbar">
  <div class="product">Care Circle</div>
  <div class="meta" id="topbar-meta"></div>
</div>
<div id="product-tagline" style="padding: var(--sp-2) var(--sp-5); font-size: var(--fs-1); color: var(--ink-2); background: var(--bg-raise); border-bottom: var(--border-w) solid var(--line);">
  Suggests help from your Care Circle when you log a hospital visit — you approve everything before anything sends.
</div>
<div id="no-key-banner"></div>

<div id="view-tabs" style="padding: var(--sp-3) var(--sp-5); display: flex; gap: var(--sp-2); background: var(--bg-raise); border-bottom: var(--border-w) solid var(--line);">
  <button id="tab-console" class="btn primary">Console</button>
  <button id="tab-evals" class="btn">Evals</button>
</div>

<div id="console-view">

<div class="console">

  <div class="panel" id="cases-panel">

      <div id="case-cards" style="margin-top: var(--sp-3);"></div>
    </div>
  </div>

  <div class="panel" id="main-panel">
    <div class="panel-head">Case detail</div>
    <div class="panel-body" id="main-work-area"></div>
  </div>

  <div class="panel" id="log-panel">
    <div class="panel-head">Run log</div>
    <div class="panel-body">

    </div>
  </div>

</div>

<div class="secondary-panels">

    <div class="panel-head">Settings</div>

  </div>

  <div class="panel" id="roster-panel">
    <div class="panel-head">Care Circle Roster</div>
    <div class="panel-body" id="roster-list">Loading...</div>
  </div>

  <div class="panel" id="policy-panel">
    <div class="panel-head">Policy files</div>
    <div class="panel-body" id="policy-list">Loading...</div>
  </div>

</div>

</div>

<div id="evals-view" style="display: none;">
  <div class="secondary-panels">
    <div class="panel" id="evals-panel">
      <div class="panel-head">Evals</div>
      <div class="panel-body">
        <div class="scoreboard" id="evals-scoreboard"></div>
        <div id="evals-table-wrap" style="overflow-x: auto;"></div>
      </div>
    </div>
    <div class="panel" id="improvement-panel">
      <div class="panel-head">Improvement — on the record</div>
      <div class="panel-body" id="improvement-body"></div>
    </div>
    <div class="panel" id="limitations-panel">
      <div class="panel-head">Known limitations</div>
      <div class="panel-body" id="limitations-body"></div>
    </div>
  </div>
</div>

// ---- policies/help_policy.md ----
const HELP_POLICY_MD = `# Help Policy

## 1. Scope — in-scope health events
Care Circle may offer outreach suggestions for medical events that involve a hospital, ER, urgent care, or short-term rehab stay, including:
- Scheduled surgery or procedure
- Emergency room visit (injury, illness, acute symptoms)
- Infection or illness requiring inpatient monitoring
- Fall or injury requiring evaluation or admission
- Medication or treatment adjustment requiring observation

## 2. Out-of-scope — excluded categories
The agent does not offer Care Circle outreach for events involving:
- Domestic violence, threats, or safety incidents involving law enforcement
- Involuntary psychiatric hold or mental health crisis requiring safety intervention
- Substance-related emergency involving legal or safety intervention
- Any event where the described situation involves risk of harm from another person

For excluded categories: express sympathy only. Do not suggest outreach, do not ask about help types, do not offer to match Care Circle members. See escalation_policy.md, Trigger 2.

## 3. Disclosure rules — minimum necessary information
Outbound messages default to need-based framing, not diagnosis-based framing.
- Include: the type of help needed and a rough timeframe.
- Never include: diagnosis, treatment details, medication names, or clinical specifics — even if the user's own event log contains them.
- Example: write "I could use help with groceries this week" — not "I have pneumonia and need groceries."
- The user may add extra context to a draft manually, but the agent never generates diagnosis language on its own.

## 4. Help types (canonical list)
- Meals
- Groceries
- Transportation
- Pet Care
- Notify Family
- Errands

Only help types marked as opted in for a Care Circle member in care_circle_roster.csv may be matched to that member.

When more than one help type comes to mind for a described situation, suggest the fewest that plausibly address it — usually one or two. Don't pad the suggestion with every conceivable type; only add a type beyond the obvious one if the event description itself implies it. "Implies" includes clear functional consequences of the injury or illness, not only types the description names outright — e.g., a hand, wrist, or arm injury that limits grip or lifting implies difficulty with both meal preparation and grocery shopping/carrying, so Meals and Groceries are usually implied together for this injury type, not an either/or choice. Transportation is a separate judgment call and should only be added if the description mentions travel or appointments.

## 5. Tone guidelines
- Friendly, direct, neutral.
- Not overly formal ("Dear Sydney, I am writing to inform you...") and not overly familiar or presumptive ("hey bestie, huge favor!!").
- State the need plainly, thank the recipient for being part of the Care Circle, include the sign-up/response link.
- When a single message covers more than one help type, present them as separate optional asks, not a combined checklist — e.g., "I could use help with two things: meals and groceries — either one would help, no need to cover both." The same message goes to every approved recipient regardless of which single type they're opted into, so it must never imply a recipient is expected to cover every need listed.
- When sending to a Care Circle member for a help type they have not opted into (the "ask anyway" path — see escalation_policy.md, Trigger 3), say so plainly and make the ask low-pressure and easy to decline. Never phrase it as if it were a normal matched request.
`;

// ---- policies/escalation_policy.md ----
const ESCALATION_POLICY_MD = `# Escalation Policy

## Trigger 1 — Low confidence or missing data
Condition: the event description itself does not give enough signal to make even a rough, defensible estimate of duration or help type — not merely because an exact day-count or help type wasn't pre-recorded in the log. Estimating duration and help type from the described situation is part of the agent's normal job (target workflow step 2). Use ordinary judgment about how situations like the one described typically unfold: an ER visit for a likely fracture is typically a short, same-day-or-next-day event, and a reasonable estimate is appropriate. A vague description with an unstated or unclear cause (e.g., "difficulty walking," cause unknown) could range from minor to serious and genuinely warrants a clarifying question.
Behavior: when the description is genuinely too vague to estimate, ask clarifying questions, including inviting the user's own estimate. Do not invent a specific number or help type you have no reasonable basis for. When the description does give enough signal, make the estimate yourself and proceed — do not ask just because an exact value wasn't logged.

## Trigger 2 — Excluded health event category
Condition: the event falls into an out-of-scope category per help_policy.md section 2 (safety incidents, involuntary psychiatric hold, domestic violence, substance-related emergency involving legal/safety intervention).
Behavior: express sympathy only. Do not offer outreach, do not ask about help types, do not suggest or draft a message. Log the event as "no outreach offered - out of scope" and stop.

## Trigger 3 — No Care Circle match
Condition: no Care Circle member's opted-in help types and availability pattern match the identified need(s).
Behavior: express sympathy, state plainly in the suggestion message itself — not only in internal reasoning — that no match was found for the needed help type, and ask the user whether they'd like to ask an existing Care Circle member anyway, even without a declared match. Do not offer to register a new person — that is out of scope for v1. Do not draft the ask-anyway message until the user has explicitly confirmed they want to proceed — asking the question and answering it in the same turn is not a real confirmation.
If the user chooses to ask an existing member anyway: the drafted message must say plainly that this isn't what the person signed up for and make it easy to decline. See help_policy.md, section 5, and message_examples.md, example 6. Never phrase an "ask anyway" message as if it were a normal matched request.

## Trigger 4 — User requests deferral
Condition: the user asks to wait or be checked on later — whether stated directly ("check back with me in a couple hours," "ask me later") or implied ("I don't want to bug anyone yet, let's wait and see") — rather than proceeding now, whether or not they've also mentioned possible needs.
Behavior: acknowledge the request, and reflect back only the needs they've already mentioned themselves so they know they were heard. If the user has not mentioned any specific need, say so plainly — do not name, suggest, or speculate about possible help types (meals, groceries, transportation, etc.), and do not preview or reference Care Circle member availability for any need the user has not stated. Do not attempt to match Care Circle members or draft an outbound message yet — wait for explicit confirmation before proceeding. This app does not implement an actual timed resume; the case is scored on whether the agent correctly declines to act — and declines to speculate — ahead of the user's stated preference, not on an automatic follow-up.
`;

const SYSTEM_PROMPT = `ROLE
You are the Care Circle agent. You are hired to suggest a mode of help from a patient's or caregiver's Care Circle, draft a corresponding request for help, and send the request upon user approval, for a patient experiencing a hospital visit or their caregiver, within help_policy.md and escalation_policy.md. You escalate when confidence is low, data is missing, or the health event violates help_policy.md.

CONTEXT
For each case you will be given: the logged health event (from health_event_history.csv), the full Care Circle roster with each member's help type and availability pattern (from care_circle_roster.csv), the relevant policy files (help_policy.md, escalation_policy.md, message_examples.md), and any persisted state from earlier turns on this same event. Use only this context. Never invent facts, names, availability, or policy language that was not given to you.

RULES — you must not:
- Send a message to a Care Circle member without approval at every gate — before drafting, and again before sending.
- Add or remove people from the Care Circle, or change their stated capabilities.
- Invent a specific duration or help type you have no reasonable basis for. Estimating duration and help type from the event description is expected — that is a normal part of the job. Ask a clarifying question only when the description itself doesn't give enough signal to make even a rough, defensible estimate — not merely because an exact value wasn't logged.
- Include diagnosis, treatment details, medication names, or clinical specifics in an outbound message, even if the event log contains them.
- Register a new person to the Care Circle — that is out of scope for v1.
- Match a help type to a Care Circle member who has not opted into that type, unless the user has explicitly chosen the "ask anyway" path — and if so, the message must say plainly that this isn't what the person signed up for.
- Cite a policy section, record ID, or roster entry that was not actually given to you in CONTEXT. Every citation must be real and checkable. If a fact you need to support a decision isn't in the provided context, do not invent a citation for it — ask a clarifying question or escalate instead.
- Suggest more help types than the situation plausibly calls for. Suggest the fewest types that plausibly address the described need — usually one or two — per help_policy.md section 4. Only add a type beyond the obvious one if the description itself implies it.

OUTPUT
Respond with exactly these labeled fields, each on its own line, in plain text with no markdown formatting (no asterisks, no bold, no headers) — the field labels are parsed exactly as written below, so do not alter, omit, or reorder them:
STATUS: "OK", or "REFUSED-ESCALATE" followed by a short reason — see ESCALATION below for exactly when each applies
SUGGESTION_MESSAGE: the sympathy + ask message suggesting Care Circle outreach, or the clarifying question if data is missing
DRAFT_MESSAGE: the single draft outbound message covering all requested help types, phrased as separate optional asks — or blank if not yet applicable. This exact text is sent unchanged to every person in MATCHED_RECIPIENTS. If more than one person is matched, the greeting must NOT name one specific recipient (use a neutral opener like "Hi —" instead of "Hi Sydney —") — naming one person in a message sent to several others is a defect. Only use a named greeting when exactly one recipient is matched.
MATCHED_RECIPIENTS: the Care Circle members matched, with their help type and availability — or "None" plus the no-match acknowledgment
WHY: one or two sentences naming the specific data you used (record IDs, names) and the specific policy line you applied — not a vague summary
CITATIONS: every source you relied on, as short tags on a single line separated by semicolons (not one per line) — the exact policy file and section (e.g., "help_policy.md section 1") and the exact record IDs or roster names you used (e.g., "EVT-001", "care_circle_roster.csv: Sydney Adamu"). Cite only sources actually given to you in CONTEXT — never a section number, record ID, or name you were not given.
ESCALATION: "None", or the reason if this case must stop here

ESCALATION
The ESCALATION output field and the STATUS output field answer two different questions — do not conflate them:
- ESCALATION answers "did this case stop before completing the full suggest -> draft -> send flow?" Populate it with the specific reason whenever any of the four conditions below apply. Leave it "None" ONLY when the case proceeds normally through matching and drafting.
- STATUS answers "was a cannot-do rule actually violated?" That is true for only ONE of the four conditions below (the excluded-category one). STATUS being "OK" does NOT mean ESCALATION should be "None" — a clarifying question, a no-match result, or a deferral still stopped the case, and ESCALATION must say so, even though none of those three is a rule violation.

Stop and escalate — populate ESCALATION with the reason — when:
- The event description itself is too vague to make even a rough, defensible estimate of duration or help type (e.g., an unstated or unclear cause) — ask clarifying questions, including inviting the user's own estimate. This is different from simply lacking a pre-recorded exact value: if the description gives enough signal to estimate (e.g., a described injury type with a typical, predictable course), make that estimate yourself and proceed — do not ask just because an exact number wasn't logged. Set STATUS to OK; set ESCALATION to the reason a clarifying question was needed.
- The event falls into an excluded category per help_policy.md section 2 — sympathy only, no outreach offer. This is the one case where your cannot-do rules are actually in play: you must refuse to offer or discuss outreach for this event. Set STATUS to "REFUSED-ESCALATE" followed by the specific excluded-category rule from help_policy.md section 2 that applies; set ESCALATION to the same reason. This is the only condition that produces REFUSED-ESCALATE.
- No Care Circle member matches the needed help type and availability — sympathy, and state plainly in SUGGESTION_MESSAGE itself (not only in WHY) that no match was found, then offer to ask an existing member anyway. Leave DRAFT_MESSAGE blank — do not draft the ask-anyway message in the same turn as asking the question; asking and answering your own question is not a real confirmation. Set STATUS to OK; set ESCALATION to the reason no match was found.
- The user asks to wait or be checked on later rather than proceeding now — whether stated directly or only implied (e.g. "let's just wait and see") — acknowledge the request and reflect back only the needs they've already stated themselves. If they have not stated any need, say so plainly — do not name, suggest, or speculate about possible help types, and do not preview or mention Care Circle member availability for any need they have not stated. Do not match or draft yet. Set STATUS to OK; set ESCALATION to the reason (the user asked to wait).
`;

// ---- day-of-week helper: computed here so the agent never has to infer a
// weekday/weekend fact from a date string itself (that reasoning is unreliable) ----
function dayOfWeekInfo(dateStr) {
  const d = new Date(dateStr + "T00:00:00Z");
  const dayName = d.toLocaleDateString("en-US", { weekday: "long", timeZone: "UTC" });
  const isWeekend = dayName === "Saturday" || dayName === "Sunday";
  return `${dayName} (${isWeekend ? "Weekend" : "Weekday"})`;
}

// ---- build the per-case context sent to the API alongside SYSTEM_PROMPT ----
function buildUserContent(event, linkedHistory) {
  const rosterText = CARE_CIRCLE_ROSTER
    .map(m => `${m.name} — ${m.help_type}, ${m.availability_pattern}, prefers ${m.preferred_method} (${m.preferred_method === "Text" ? m.phone : m.email})`)
    .join("\n");

  const linkedText = linkedHistory.length
    ? linkedHistory.map(h => `${h.help_type} — ${h.member_name} (requested ${h.request_date}, helped ${h.help_date})`).join("\n")
    : "(none yet)";

  return `CASE:
Event ID: ${event.event_id}
Date logged: ${event.date_logged}
Day of week logged (computed, use this — do not calculate your own): ${dayOfWeekInfo(event.date_logged)}
Logged by: ${event.logged_by}
Event description: "${event.event_description}"
Reason category: ${event.reason_category}
Duration known: ${event.duration_known}
Estimated duration (days): ${event.estimated_duration_days || "(not recorded)"}
Status: ${event.status}
Help requested so far: ${event.help_requested || "(none)"}
Help received so far: ${event.help_received || "(none)"}

CARE CIRCLE ROSTER:
${rosterText}

LINKED CARE CIRCLE HISTORY FOR THIS EVENT:
${linkedText}

POLICY — help_policy.md:
${HELP_POLICY_MD}

POLICY — escalation_policy.md:
${ESCALATION_POLICY_MD}

POLICY — message_examples.md (reference only, do not quote verbatim):
${MESSAGE_EXAMPLES_MD}`;
}

// ---- parse the agent's strict labeled-field output ----
const OUTPUT_FIELDS = ["STATUS", "SUGGESTION_MESSAGE", "DRAFT_MESSAGE", "MATCHED_RECIPIENTS", "WHY", "CITATIONS", "ESCALATION"];
const REQUIRED_OUTPUT_FIELDS = ["STATUS", "SUGGESTION_MESSAGE", "WHY", "CITATIONS", "ESCALATION"];

function parseAgentOutput(text) {
  const pattern = new RegExp(`^(${OUTPUT_FIELDS.join("|")}):[ \\t]*`, "gm");
  const matches = [...text.matchAll(pattern)];
  if (matches.length === 0) return null;

  const parsed = {};
  matches.forEach((match, i) => {
    const fieldName = match[1];
    const start = match.index + match[0].length;
    const end = i + 1 < matches.length ? matches[i + 1].index : text.length;
    parsed[fieldName] = text.slice(start, end).trim();
  });

  const hasAllRequired = REQUIRED_OUTPUT_FIELDS.every(f => f in parsed);
  return hasAllRequired ? parsed : null;
}

// ---- case selection + main work area ----
let SELECTED_EVENT_ID = HEALTH_EVENTS.length ? HEALTH_EVENTS[0].event_id : null;

function outcomeForResult(result) {
  if (!result) return null;
  if (!result.parsed) return "ERROR";
  const s = (result.parsed.STATUS || "").toUpperCase();
  if (s.indexOf("REFUSED") === 0) return "REFUSED-ESCALATE";
  if (s.indexOf("OK") === 0) return "OK";
  return "ERROR";
}

function badgeClassForOutcome(outcome) {
  if (outcome === "OK") return "ok";
  if (outcome === "REFUSED-ESCALATE") return "danger";
  if (outcome === "ERROR") return "warn";
  return "neutral";
}

// Once a human has reviewed a case, the card badge reflects that review
// state (Approved / Edited / Escalated) instead of the raw agent outcome —
// the human action is the more current, more relevant status.
function cardBadgeInfo(eventId) {
  const result = CASE_RESULTS[eventId];
  if (!result) return null;

  if (result.reviewState) {
    const cls = result.reviewState === "Approved" ? "ok"
      : result.reviewState === "Escalated" ? "danger"
      : "warn";
    return { text: result.reviewState, cls };
  }

  const outcome = outcomeForResult(result);
  if (!outcome) return null;
  return { text: outcome, cls: badgeClassForOutcome(outcome) };
}

function selectCase(eventId) {
  SELECTED_EVENT_ID = eventId;
  renderCaseList();
  renderMainArea();
}

// ---- stage labels — the loop, named on screen (Prompt 11) ----
function stageLabel(n, text) {
  const el = document.createElement("div");
  el.className = "stage";
  el.setAttribute("data-n", n);
  el.textContent = text;
  return el;
}

function buildFieldRow(field, rawValue) {
  const row = document.createElement("div");
  row.className = "field";

  const k = document.createElement("div");
  k.className = "k";
  k.textContent = field.replace(/_/g, " ");

  const v = document.createElement("div");
  v.className = "v" + (field === "WHY" ? " why" : "");

  if (field === "CITATIONS") {
    const tags = (rawValue || "").split(/[;\n]+/).map(t => t.replace(/^[-*]\s*/, "").trim()).filter(Boolean);
    if (tags.length === 0) {
      v.textContent = "(no citations given)";
    } else {
      tags.forEach(tag => {
        const chip = document.createElement("span");
        chip.className = "chip cite";
        chip.textContent = tag;
        chip.style.marginRight = "var(--sp-1)";
        chip.style.marginBottom = "var(--sp-1)";
        v.appendChild(chip);
      });
    }
  } else {
    v.textContent = rawValue || "(empty)";
  }

  row.appendChild(k);
  row.appendChild(v);
  return row;
}

function renderMainArea() {
  const container = document.getElementById("main-work-area");
  container.innerHTML = "";

  if (!SELECTED_EVENT_ID) {
    const empty = document.createElement("div");
    empty.className = "empty";
    const headline = document.createElement("div");
    headline.className = "headline";
    headline.textContent = "Select a case";
    empty.appendChild(headline);
    empty.appendChild(document.createTextNode("Pick a case from the left to see its context and run the agent."));
    container.appendChild(empty);
    return;

// ---- human gate + run log (Prompt 07) ----
const CASE_RESULTS = {}; // eventId -> { rawText, parsed, draftText }
const RUN_LOG = [];      // { timestamp, eventId, decision, humanAction, detail }

function storeCaseResult(eventId, rawText) {
  const parsed = parseAgentOutput(rawText);
  CASE_RESULTS[eventId] = {
    rawText,
    parsed,
    draftText: parsed ? (parsed.DRAFT_MESSAGE || "") : rawText
  };
  return parsed;
}

function summarizeDecision(eventId) {
  const result = CASE_RESULTS[eventId];
  if (!result) return "(no result)";
  const source = result.parsed
    ? `${result.parsed.STATUS || "(no status)"} — ${result.parsed.SUGGESTION_MESSAGE || ""}`
    : `(unparsed output) ${result.rawText}`;
  return source.length > 90 ? source.slice(0, 90) + "..." : source;
}

function logAction(eventId, humanAction, detail) {
  RUN_LOG.push({
    timestamp: new Date().toLocaleString(),
    eventId,
    decision: summarizeDecision(eventId),
    humanAction,
    detail: detail || ""
  });
  renderRunLog();
}

function renderRunLog() {
  const container = document.getElementById("run-log");
  container.innerHTML = "";

  if (RUN_LOG.length === 0) {
    container.textContent = "No runs logged yet.";
    return;
  }

  [...RUN_LOG].reverse().forEach(entry => {
    const row = document.createElement("div");
    row.className = "row";

    const t = document.createElement("span");
    t.className = "t";
    t.textContent = entry.timestamp;
    row.appendChild(t);

    const rest = document.createElement("span");
    rest.appendChild(document.createTextNode(`${entry.eventId} — ${entry.decision} — `));

    const actionClass = entry.humanAction === "Approved" ? "action-approve"
      : entry.humanAction === "Edited" ? "action-edit"
      : entry.humanAction === "Escalated" ? "action-escalate"
      : "";
    const actionSpan = document.createElement("span");
    if (actionClass) actionSpan.className = actionClass;
    actionSpan.textContent = entry.humanAction;
    rest.appendChild(actionSpan);

    if (entry.detail) rest.appendChild(document.createTextNode(` (${entry.detail})`));

    row.appendChild(rest);
    container.appendChild(row);
  });
}

const DECISION_FIELDS = ["SUGGESTION_MESSAGE", "WHY"];
const OUTPUT_DISPLAY_FIELDS = ["DRAFT_MESSAGE", "MATCHED_RECIPIENTS", "CITATIONS", "ESCALATION"];

function renderAgentResult(container, rawText, eventId) {
  const parsed = storeCaseResult(eventId, rawText);
  container.innerHTML = "";

  if (!parsed) {
    container.appendChild(stageLabel(3, "Decision"));
    const note = document.createElement("div");
    note.className = "error-note";
    note.textContent = "Notice: agent output did not match the expected format. Showing raw text:\n\n" + rawText;
    container.appendChild(note);
  } else {
    container.appendChild(stageLabel(3, "Decision"));

    const statusValue = parsed.STATUS || "(missing)";
    const isRefused = statusValue.toUpperCase().indexOf("REFUSED") === 0;
    const statusBadge = document.createElement("span");
    statusBadge.className = "badge " + (isRefused ? "danger" : "ok");
    statusBadge.textContent = statusValue;
    container.appendChild(statusBadge);

    const decisionWrap = document.createElement("div");
    decisionWrap.style.marginTop = "var(--sp-3)";
    DECISION_FIELDS.forEach(field => {
      if (!(field in parsed)) return;
      decisionWrap.appendChild(buildFieldRow(field, parsed[field]));
    });
    container.appendChild(decisionWrap);

    container.appendChild(stageLabel(4, "Output"));
    const outputWrap = document.createElement("div");
    OUTPUT_DISPLAY_FIELDS.forEach(field => {
      if (!(field in parsed)) return;
      outputWrap.appendChild(buildFieldRow(field, parsed[field]));
    });
    container.appendChild(outputWrap);
  }

  container.appendChild(stageLabel(5, "Review"));

  const boundary = document.createElement("div");
  boundary.className = "boundary-note";
  boundary.textContent = "Nothing is sent without human approval.";
  container.appendChild(boundary);

  const gateContainer = document.createElement("div");
  gateContainer.className = "gate";
  container.appendChild(gateContainer);
  renderGate(gateContainer, eventId);
}

// ---- run a case: call the Anthropic Messages API directly from the browser ----
// Returns an outcome string for the Run All summary: "OK", "REFUSED-ESCALATE", or "ERROR".
async function runCase(eventId) {
  const apiKey = localStorage.getItem(API_KEY_STORAGE_KEY);

  function liveContainer() {
    return SELECTED_EVENT_ID === eventId ? document.getElementById("main-result-holder") : null;
  }

  if (!apiKey) {
    const c = liveContainer();
    if (c) setResultError(c, "No API key saved yet — add your Anthropic API key in Settings below, then try again.");
    return "ERROR";
  }

  const event = HEALTH_EVENTS.find(e => e.event_id === eventId);
  const linkedHistory = CARE_CIRCLE_HISTORY.filter(h => h.event_id === eventId);
  const userContent = buildUserContent(event, linkedHistory);

  const runningContainer = liveContainer();
  if (runningContainer) setThinking(runningContainer);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: {
        "x-api-key": apiKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json"
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1024,
        system: SYSTEM_PROMPT,
        messages: [{ role: "user", content: userContent }]
      })
    });

    const raw = await response.text();

    if (!response.ok) {
      let friendly = `API error (HTTP ${response.status}).`;
      try {
        const errJson = JSON.parse(raw);
        const type = errJson.error && errJson.error.type;
        const msg = errJson.error && errJson.error.message;
        if (type === "authentication_error") friendly = "Bad API key — check what you saved in Settings.";
        else if (type === "permission_error") friendly = "This API key doesn't have permission for this request.";
        else if (type === "rate_limit_error") friendly = "Rate limited — wait a moment and try again.";
        else if (type === "invalid_request_error" && msg && msg.toLowerCase().includes("credit")) friendly = "Your Anthropic account is out of credit.";
        else if (type === "overloaded_error") friendly = "Anthropic's API is overloaded right now — try again shortly.";
        else if (msg) friendly = msg;
      } catch (parseErr) {
        // raw response wasn't JSON — fall back to the generic HTTP-status message above
      }
      const errContainer = liveContainer();
      if (errContainer) setResultError(errContainer, `${friendly}\n\nRaw response: ${raw}`);
      renderCaseList();
      return "ERROR";
    }

    const data = JSON.parse(raw);
    const text = (data.content && data.content[0] && data.content[0].text) ? data.content[0].text : raw;

    const successContainer = liveContainer();
    let parsed;
    if (successContainer) {
      renderAgentResult(successContainer, text, eventId);
      parsed = CASE_RESULTS[eventId].parsed;
    } else {
      parsed = storeCaseResult(eventId, text);
    }
    renderCaseList();

    if (!parsed) return "ERROR";
    const statusValue = (parsed.STATUS || "").toUpperCase();
    if (statusValue.indexOf("REFUSED") === 0) return "REFUSED-ESCALATE";
    if (statusValue.indexOf("OK") === 0) return "OK";
    return "ERROR";
  } catch (err) {
    const catchContainer = liveContainer();
    if (catchContainer) setResultError(catchContainer, `Could not reach the Anthropic API — check your internet connection.\n\nRaw error: ${err.message}`);
    renderCaseList();
    return "ERROR";
  }
}

// ---- Run All: sweep every case in sequence, then summarize ----
async function runAllCases() {
  const btn = document.getElementById("run-all-btn");
  const progress = document.getElementById("run-all-progress");
  const summaryEl = document.getElementById("run-all-summary");

  btn.disabled = true;
  summaryEl.textContent = "";
  const counts = { OK: 0, "REFUSED-ESCALATE": 0, ERROR: 0 };

  for (let i = 0; i < HEALTH_EVENTS.length; i++) {
    const ev = HEALTH_EVENTS[i];
    progress.textContent = `Running ${i + 1} of ${HEALTH_EVENTS.length} (${ev.event_id})...`;
    selectCase(ev.event_id);
    const outcome = await runCase(ev.event_id);
    counts[outcome] = (counts[outcome] || 0) + 1;
  }

  progress.textContent = `Done — ${HEALTH_EVENTS.length} cases run.`;
  summaryEl.textContent = `Summary: ${counts.OK} OK, ${counts["REFUSED-ESCALATE"]} REFUSED-ESCALATE, ${counts.ERROR} errors.`;
  btn.disabled = false;
}

// ---- Evals table: Case / Expected behavior / Actual / Verdict / Run (Prompt 16) ----
function summarizeForEval(result) {
  if (!result) return "(not run yet)";
  if (!result.parsed) return `(unparsed output) ${result.rawText}`;
  const p = result.parsed;
  const parts = [`STATUS: ${p.STATUS || "(missing)"}`];
  if (p.SUGGESTION_MESSAGE) parts.push(`Suggestion: ${p.SUGGESTION_MESSAGE}`);
  if (p.MATCHED_RECIPIENTS) parts.push(`Matched: ${p.MATCHED_RECIPIENTS}`);
  if (p.DRAFT_MESSAGE) parts.push(`Draft: ${p.DRAFT_MESSAGE}`);
  if (p.ESCALATION) parts.push(`Escalation: ${p.ESCALATION}`);
  return parts.join(" | ");
}

function renderImprovementCard() {
  const container = document.getElementById("improvement-body");
  if (!container) return;
  container.innerHTML = "";
  [["Before", IMPROVEMENT_CARD.before], ["Change", IMPROVEMENT_CARD.change], ["After", IMPROVEMENT_CARD.after]].forEach(([label, text]) => {
    const field = document.createElement("div");
    field.className = "field";
    const k = document.createElement("div");
    k.className = "k";
    k.textContent = label;
    const v = document.createElement("div");
    v.className = "v";
    v.textContent = text;
    field.appendChild(k);
    field.appendChild(v);
    container.appendChild(field);
  });
}

// ---- known limitations: specific, honest, no marketing language (Prompt 20) ----
const KNOWN_LIMITATIONS = [
  "Single-shot per case, no real multi-turn conversation or timed resume. A deferral (Trigger 4) is judged on whether the agent correctly declines to act now — not on an actual follow-up call two hours later, which this prototype cannot do.",
  "Model output is not fully deterministic. The same case can behave differently on different runs — confirmed directly in this build: EVAL-04 needed 3 runs to catch an intermittent invented-need bug, and EVAL-03 needed 4 re-runs to confirm a fix actually held.",
  "Scope is limited to hospital, ER, urgent care, and short-term rehab events per help_policy.md section 1. It does not coordinate ongoing chronic care, outpatient visits, or non-medical caregiving requests.",
  "The Care Circle roster is fixed for this prototype. There is no in-app way to add, remove, or update a member's help type or availability — registering a new person is explicitly out of scope for v1.",
  "Nothing actually sends. Approving a draft logs the action and displays the message in the run log — there is no real text or email delivery to the recipient."
];

function renderKnownLimitations() {
  const container = document.getElementById("limitations-body");
  if (!container) return;
  container.innerHTML = "";
  const list = document.createElement("ul");
  list.className = "limitations-list";
  KNOWN_LIMITATIONS.forEach(text => {
    const li = document.createElement("li");
    li.textContent = text;
    list.appendChild(li);
  });
  container.appendChild(list);
}

// ---- scoreboard: Pass / Needs work / Fail counts, evidence that stays visible (Prompt 18) ----
function renderScoreboard() {
  const container = document.getElementById("evals-scoreboard");
  if (!container) return;
  const saved = loadEvalResults();

  let pass = 0, needsWork = 0, fail = 0, judged = 0, lastRunMs = null, lastRunLabel = "—";

  EVAL_CASES.forEach(ec => {
    const r = saved[ec.case_id];
    if (!r || !r.verdict) return;
    judged++;
    if (r.verdict === "Pass") pass++;
    else if (r.verdict === "Needs work") needsWork++;
    else if (r.verdict === "Fail") fail++;
    if (r.judgedAtMs && (!lastRunMs || r.judgedAtMs > lastRunMs)) {
      lastRunMs = r.judgedAtMs;
      lastRunLabel = r.judgedAt;
    }
  });

  const stats = [
    { n: pass, l: "Pass", cls: "ok" },
    { n: needsWork, l: "Needs work", cls: "warn" },
    { n: fail, l: "Fail", cls: "danger" },
    { n: `${judged}/${EVAL_CASES.length}`, l: "Cases judged", cls: "" },
    { n: lastRunLabel, l: "Last judged", cls: "" }
  ];

  container.innerHTML = "";
  stats.forEach(s => {
    const stat = document.createElement("div");
    stat.className = "stat" + (s.cls ? " " + s.cls : "");
    const n = document.createElement("div");
    n.className = "n";
    n.textContent = s.n;
    const l = document.createElement("div");
    l.className = "l";
    l.textContent = s.l;
    stat.appendChild(n);
    stat.appendChild(l);
    container.appendChild(stat);
  });
}

// Pulls the latest Actual summary from CASE_RESULTS for every eval case —
// covers running a case via the console Run button or Run All, not just
// the per-row Evals Run button.
function refreshEvalsActuals() {
  EVAL_CASES.forEach(ec => {
    const cell = document.getElementById(`eval-actual-${ec.case_id}`);
    if (!cell) return;
    const result = CASE_RESULTS[ec.event_id];
    if (result) cell.textContent = summarizeForEval(result);
  });
}

function renderEvalsTable() {
  const container = document.getElementById("evals-table-wrap");
  container.innerHTML = "";
  const saved = loadEvalResults();

  const table = document.createElement("table");
  table.className = "evals-table";

  const headerRow = document.createElement("tr");
  ["Case", "Expected behavior", "Actual", "Verdict", "Notes", ""].forEach(text => {
    const th = document.createElement("th");
    th.textContent = text;
    headerRow.appendChild(th);
  });
  table.appendChild(headerRow);

  EVAL_CASES.forEach(ec => {
    const row = document.createElement("tr");
    const savedResult = saved[ec.case_id] || {};

    const caseTd = document.createElement("td");
    caseTd.textContent = `${ec.case_id} — ${ec.case_type}`;
    row.appendChild(caseTd);

    const expectedTd = document.createElement("td");
    expectedTd.textContent = ec.expected_behavior;
    row.appendChild(expectedTd);

    const actualTd = document.createElement("td");
    actualTd.id = `eval-actual-${ec.case_id}`;
    actualTd.textContent = "(not run yet)";
    row.appendChild(actualTd);

    const verdictTd = document.createElement("td");
    const select = document.createElement("select");
    select.id = `eval-verdict-${ec.case_id}`;
    ["", "Pass", "Needs work", "Fail"].forEach(opt => {
      const optionEl = document.createElement("option");
      optionEl.value = opt;
      optionEl.textContent = opt || "(unjudged)";
      select.appendChild(optionEl);
    });
    select.value = savedResult.verdict || "";
    select.addEventListener("change", () => {
      saveEvalResult(ec.case_id, "verdict", select.value);
    });
    verdictTd.appendChild(select);
    row.appendChild(verdictTd);

    const notesTd = document.createElement("td");
    const notesInput = document.createElement("input");
    notesInput.type = "text";
    notesInput.id = `eval-notes-${ec.case_id}`;
    notesInput.size = 30;
    notesInput.placeholder = "One-line note";
    notesInput.value = savedResult.notes || "";
    notesInput.addEventListener("change", () => {
      saveEvalResult(ec.case_id, "notes", notesInput.value);
    });
    notesTd.appendChild(notesInput);
    row.appendChild(notesTd);

    const runTd = document.createElement("td");
    const runBtn = document.createElement("button");
    runBtn.className = "btn";
    runBtn.textContent = "Run";
    runBtn.addEventListener("click", () => runEvalRow(ec.case_id));
    runTd.appendChild(runBtn);
    row.appendChild(runTd);

    table.appendChild(row);
  });

  container.appendChild(table);
  refreshEvalsActuals();
}
